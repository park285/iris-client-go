name: ci

# PUBLIC 라이브러리의 canonical PR gate. 로컬 pre-push와 동일한 lint/test/race/tidy
# 계약을 secret-free GitHub Actions에서 재현하고, dependency vulnerability freshness는
# 별도 non-PR security workflow가 담당한다.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Setup uv
        run: python -m pip install --disable-pip-version-check --no-cache-dir uv==0.12.7

      - name: Initialize Python runtime
        run: |
          interpreter="$(bash scripts/ci/python-runner.sh --print-interpreter)"
          printf 'CI_PYTHON_BIN=%s\n' "$interpreter" >>"$GITHUB_ENV"
          printf 'CI_PYTHON_RUNTIME_ROOT=%s\n' "$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Workflow secret boundary
        run: |
          bash scripts/ci/check-workflow-secrets.sh
          bash scripts/ci/check-workflow-secrets_test.sh

      - name: Workflow CI ownership contract
        run: |
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner.py
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner_test.py

      - name: Release provenance contract
        run: bash scripts/ci/check-release-provenance.sh

      - name: Cross-cutting boundary guardrail
        run: bash scripts/ci/check-crosscutting-boundaries.sh

      - name: gofmt
        run: |
          mapfile -t files < <(find . -path './.git' -prune -o -name '*.go' -print)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt required for the following files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Lint
        run: |
          bash scripts/check-hmac-boundary.sh
          bash scripts/check-hmac-boundary_test.sh
          bash scripts/ci/go-tooling.sh golangci-lint run -c .golangci.yml ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Module tidy drift
        run: go mod tidy -diff

  # dedup 예약/확정/해제의 원자성과 소유권 검증은 Lua 스크립트가 소유하므로 실제 Valkey
  # 인스턴스에서만 평가된다. quality job은 이 경로를 전혀 실행하지 않는다.
  dedup-contract:
    name: dedup-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      valkey:
        image: valkey/valkey@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328 # 9.1.1-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Valkey Lua contract tests
        run: IRIS_CLIENT_VALKEY_TEST_ADDR=127.0.0.1:6379 go test -race -count=1 -v ./internal/dedup/
