name: ci

# PUBLIC 라이브러리의 canonical PR gate. 로컬 pre-push와 동일한 lint/race/tidy
# 계약을 secret-free GitHub Actions에서 재현하고, dependency vulnerability freshness는
# 별도 non-PR security workflow가 담당한다.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # 캐시는 같은 키를 쓰는 job 중 먼저 끝난 job의 내용이 저장되고, 키가 이미 있으면 갱신되지 않는다.
          # golangci-lint를 빌드하는 이 job이 자기 캐시를 갖도록 workflow 파일을 키에 넣는다.
          cache-dependency-path: |
            go.sum
            scripts/ci/go-tooling.sh
            .github/workflows/ci.yml

      - name: Module tidy drift
        run: make tidy

      - name: Lint
        run: make lint

      - name: Signer allocation ceiling
        run: make test-allocations

      - name: Race tests
        run: make test-race
