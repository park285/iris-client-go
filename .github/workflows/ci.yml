name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            scripts/ci/pre-push-gate.sh
            scripts/ci/resolve-go-tool.py
            .github/workflows/ci.yml

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Comment ban scan
        run: bash scripts/ci/verify-tools.sh scan

      - name: Module tidy drift
        run: make tidy

      - name: Lint and build
        run: make lint build

      - name: Signer allocation ceiling
        run: make test-allocations

      - name: Race tests
        run: make MODULES= test-race
