name: ci

# PUBLIC 라이브러리의 canonical PR gate. 로컬 pre-push와 동일한 lint/race/tidy
# 계약을 secret-free GitHub Actions에서 재현하고, dependency vulnerability freshness는
# 별도 non-PR security workflow가 담당한다.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # 캐시 키는 이미 있으면 갱신되지 않으므로 도구 버전 파일을 넣어 도구가 바뀔 때 새 캐시를 저장한다.
          cache-dependency-path: |
            go.sum
            scripts/ci/go-tooling.sh

      - name: Module tidy drift
        run: make tidy

      - name: Lint
        run: make lint

      - name: Signer allocation ceiling
        run: make test-allocations

      - name: Race tests
        run: make test-race

  # dedup 예약/확정/해제의 원자성과 소유권 검증은 Lua 스크립트가 소유하므로 실제 Valkey
  # 인스턴스에서만 평가된다. quality job은 이 경로를 전혀 실행하지 않는다.
  dedup-contract:
    name: dedup-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      valkey:
        image: valkey/valkey@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11 # 9.1.2-alpine3.24
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # 캐시 키는 이미 있으면 갱신되지 않으므로 도구 버전 파일을 넣어 도구가 바뀔 때 새 캐시를 저장한다.
          cache-dependency-path: |
            go.sum
            scripts/ci/go-tooling.sh

      - name: Valkey Lua contract tests
        run: make test-valkey VALKEY_TEST_ADDR=127.0.0.1:6379
